name: Repair Artifact Signing role

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair-role:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Grant the certificate-profile signer role
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(
            az resource list \
              --resource-type Microsoft.CodeSigning/codeSigningAccounts \
              --query "[?name=='flarial'].id | [0]" \
              --output tsv
          )"

          if [[ -z "$account_id" ]]; then
            echo "::error::Artifact Signing account 'flarial' was not visible to the release identity."
            exit 1
          fi

          profile_id="${account_id}/certificateProfiles/flarial-public-trust"

          az role assignment create \
            --assignee "$AZURE_CLIENT_ID" \
            --role "Artifact Signing Certificate Profile Signer" \
            --scope "$profile_id" \
            --output none

          assignment_count="$(
            az role assignment list \
              --assignee "$AZURE_CLIENT_ID" \
              --scope "$profile_id" \
              --query "[?roleDefinitionName=='Artifact Signing Certificate Profile Signer'] | length(@)" \
              --output tsv
          )"

          if [[ "$assignment_count" -lt 1 ]]; then
            echo "::error::The signer role assignment was not visible after creation."
            exit 1
          fi

          echo "Artifact Signing signer role is assigned at the certificate-profile scope."
