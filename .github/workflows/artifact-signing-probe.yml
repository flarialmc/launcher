name: Artifact Signing no-publish probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-sign-and-verify:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Build launcher without publishing
        shell: pwsh
        run: |
          dotnet publish "src/Flarial.Launcher/Flarial.Launcher.csproj" --configuration Release
          $source = "src/Flarial.Launcher/bin/Release/win-x64/publish/Flarial.Launcher.exe"
          if (-not (Test-Path $source)) {
            throw "Expected launcher output was not produced: $source"
          }
          New-Item -ItemType Directory -Force probe | Out-Null
          Copy-Item $source "probe/Flarial.Launcher.exe"
          Get-FileHash "probe/Flarial.Launcher.exe" -Algorithm SHA256 | Format-List

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign isolated launcher probe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: flarial
          certificate-profile-name: flarial-public-trust
          files: ${{ github.workspace }}\probe\Flarial.Launcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Flarial Launcher no-publish signing probe
          description-url: https://github.com/flarialmc/launcher

      - name: Verify probe and reject revoked certificate
        shell: pwsh
        env:
          REVOKED_SIGNER_THUMBPRINT: 828DC715D160F59887564233C9F53BB4D410D21D
        run: |
          $probe = Get-AuthenticodeSignature "probe/Flarial.Launcher.exe"
          $probe | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          $hash = Get-FileHash "probe/Flarial.Launcher.exe" -Algorithm SHA256
          $hash | Format-List

          if ($probe.Status -ne 'Valid') {
            throw "Probe signature is not valid: $($probe.Status) — $($probe.StatusMessage)"
          }
          if (-not $probe.SignerCertificate) {
            throw "Probe has no signer certificate"
          }
          if ($probe.SignerCertificate.Thumbprint -eq $env:REVOKED_SIGNER_THUMBPRINT) {
            throw "Artifact Signing reused revoked certificate $env:REVOKED_SIGNER_THUMBPRINT"
          }

          "## Signed launcher probe" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Authenticode status: $($probe.Status)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Signer thumbprint: $($probe.SignerCertificate.Thumbprint)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $($hash.Hash)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload signed probe only
        uses: actions/upload-artifact@v4
        with:
          name: signed-launcher-probe-${{ github.sha }}
          path: probe/Flarial.Launcher.exe
          if-no-files-found: error
          retention-days: 3
